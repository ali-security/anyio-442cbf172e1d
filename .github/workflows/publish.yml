name: Publish packages to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build the source tarball and the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install build
      - name: Pin build backend to the release's setuptools
        run: echo "setuptools==82.0.1" > "${{ github.workspace }}/../seal-constraints.txt"
      - name: Create packages
        run: python -m build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "4.14.1"
          PIP_CONSTRAINT: ${{ github.workspace }}/../seal-constraints.txt
      - name: Archive packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish build artifacts to the PyPI
    needs: build
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Retrieve packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Upload packages
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create a GitHub release
    needs: build
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: changelog
        uses: agronholm/release-notes@v1
        with:
          path: docs/versionhistory.rst
      - uses: ncipollo/release-action@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
